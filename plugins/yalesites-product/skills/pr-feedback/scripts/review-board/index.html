<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review board</title>
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --text: #1f1e1c; --muted: #6b6a66; --faint: #9a9893;
    --border: rgba(0,0,0,.12); --border-strong: rgba(0,0,0,.24);
    --accent: #185fa5; --accent-bg: #e6f1fb; --accent-text: #0c447c;
    --mine: #c2410c; --mine-bg: #fdeee6; --mine-text: #7c2d12;
    --ok: #3b6d11; --ok-bg: #eaf3de; --danger: #a32d2d; --mark: rgba(239,159,39,.35);
    --radius: 8px; --pin: #185fa5; --pin-mine: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a19; --surface: #242423; --text: #ecebe8; --muted: #a8a7a2; --faint: #7a7975;
      --border: rgba(255,255,255,.12); --border-strong: rgba(255,255,255,.26);
      --accent: #85b7eb; --accent-bg: #0c2e52; --accent-text: #b5d4f4;
      --mine: #f0997b; --mine-bg: #4a1b0c; --mine-text: #f5c4b3;
      --ok: #97c459; --ok-bg: #1f3608; --danger: #f09595; --mark: rgba(239,159,39,.3);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  a { color: var(--accent); }
  button, textarea, input { font: inherit; color: inherit; }
  /* v2 header: one line of title + PR chips, then the stepper. */
  header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 24px 12px; }
  .h-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .h-row h1 { font-size: 16px; font-weight: 600; margin: 0; white-space: nowrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
  .chip { display: inline-flex; gap: 6px; align-items: baseline; border: 1px solid var(--border-strong); background: var(--surface); border-radius: 99px; padding: 3px 11px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .chip .num { font-weight: 600; font-variant-numeric: tabular-nums; }
  .chip .cnt { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-current="true"] { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-text); }
  .chip.complete .cnt { color: var(--ok); }
  .details-btn { border: none; background: none; color: var(--muted); font-size: 13px; cursor: pointer; padding: 2px 4px; text-decoration: underline dotted; }
  .legend { font-size: 13px; color: var(--muted); margin: 8px 0 0; display: grid; gap: 2px; }
  .stepper { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  /* Each PR gets a color (--c): its chip dot, its bracket under the stepper, its segments.
     Pale segment = open, solid = answered. */
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); align-self: center; flex: none; }
  .chip[aria-current="true"] { background: color-mix(in srgb, var(--c) 16%, var(--surface)); border-color: var(--c); color: var(--text); }
  .steps { display: flex; gap: 10px; flex: 1; min-width: 0; align-items: flex-start; }
  .grp { display: flex; flex-direction: column; gap: 4px; flex: var(--n); min-width: 0; }
  .grp .segs { display: flex; gap: 3px; }
  .grp .bracket { height: 6px; border: 2px solid var(--c); border-top: none; border-radius: 0 0 3px 3px; }
  .grp .glabel { font-size: 11px; line-height: 1; color: var(--c); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .step { height: 10px; min-width: 12px; flex: 1; border: none; border-radius: 3px; background: color-mix(in srgb, var(--c, var(--faint)) 28%, transparent); cursor: pointer; padding: 0; position: relative; }
  .step:hover { background: color-mix(in srgb, var(--c, var(--faint)) 55%, transparent); }
  .step.done { background: var(--c, var(--ok)); }
  .step.done.later { background: repeating-linear-gradient(45deg, var(--c) 0 3px, transparent 3px 6px); }
  .q-meta .tag.pr { background: color-mix(in srgb, var(--c) 18%, var(--surface)); color: var(--text); box-shadow: inset 3px 0 0 var(--c); border-radius: 4px; }
  .brief { border-left: 4px solid var(--c, var(--border)); }
  .step[aria-current="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
  .step.own { background: transparent; border: 1.5px dashed var(--border-strong); height: 10px; }
  .step.own.done { background: var(--ok); border-style: solid; border-color: var(--ok); }
  .progress { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 0; max-width: 1680px; margin: 0 auto; }
  main { padding: 24px 40px 80px; min-width: 0; }
  aside.call { position: sticky; top: var(--hh, 96px); align-self: start; max-height: calc(100vh - var(--hh, 96px)); overflow: auto; padding: 24px 24px 32px; border-left: 1px solid var(--border); background: var(--surface); min-height: calc(100vh - var(--hh, 96px)); }
  .call .kicker { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .call .ask { font-size: 21px; line-height: 1.35; font-weight: 600; margin: 0 0 18px; }
  .call .options { grid-template-columns: 1fr; gap: 8px; }
  .call .opt { padding: 11px 14px; flex-direction: row; gap: 12px; align-items: flex-start; border-radius: 10px; }
  .call .opt .key { flex: none; width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--border-strong); font-size: 12px; display: grid; place-items: center; color: var(--muted); margin-top: 1px; font-variant-numeric: tabular-nums; }
  .call .opt[aria-pressed="true"] .key { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  .call .opt .o-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .call .opt .o-label { font-size: 16px; }
  .call .opt .o-detail { font-size: 13px; }
  .call .opt.defer { border-style: dashed; }
  .call textarea { min-height: 80px; font-size: 15px; }
  .call .pager { margin-top: 18px; padding-top: 16px; }
  .call .keys { font-size: 12px; color: var(--faint); margin-top: 10px; }
  .call .notes-toggle { border: none; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 14px; margin-top: 14px; }
  /* Question header in the main column. */
  .q-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  h2.q-title { font-size: 24px; font-weight: 600; margin: 8px 0 12px; line-height: 1.3; }
  .brief { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; margin: 0 0 22px; }
  .brief .b-head { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .brief ul { margin: 0; padding-left: 20px; font-size: 16px; line-height: 1.5; }
  .brief li + li { margin-top: 3px; }
  .brief .full { font-size: 14px; color: var(--muted); margin: 10px 0 0; border-top: 1px solid var(--border); padding-top: 10px; }
  .unitcard { font-size: 14px; line-height: 1.5; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; }
  .unitcard dt { color: var(--muted); }
  .unitcard dd { margin: 0; }
  .v-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 0 0 6px; }
  .verdict { display: inline-flex; }
  .verdict .btn { border-radius: 0; padding: 5px 12px; font-size: 14px; margin-left: -1px; }
  .verdict .btn:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .verdict .btn:last-child { border-radius: 0 6px 6px 0; }
  .intro .i-row { display: grid; grid-template-columns: 130px 1fr; gap: 14px; padding: 6px 0; font-size: 16px; line-height: 1.5; }
  .intro .i-row + .i-row { border-top: 1px solid var(--border); }
  .intro .i-label { color: var(--muted); font-size: 14px; padding-top: 1px; }
  ol.coming { margin: 0; padding-left: 24px; display: grid; gap: 8px; font-size: 17px; }
  ol.coming li::marker { color: var(--c); font-weight: 600; }
  ol.coming button { border: none; background: none; padding: 0; cursor: pointer; text-align: left; font-size: 17px; color: var(--text); }
  ol.coming button:hover { color: var(--accent); text-decoration: underline; }
  ol.coming li.done button { color: var(--muted); }
  ol.coming li.done button::after { content: ' ✓'; color: var(--ok); }
  ol.coming .tag { margin-left: 8px; vertical-align: 2px; }
  .intro ul.not-asked { margin: 0; padding-left: 18px; color: var(--muted); font-size: 15px; }
  .grp .glabel.on { text-decoration: underline; text-underline-offset: 3px; }
  .evidence-h { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  @media (max-width: 1100px) {
    .layout { grid-template-columns: 1fr; }
    aside.call { position: static; max-height: none; min-height: 0; border-left: none; border-top: 1px solid var(--border); }
  }
  .tag { display: inline-block; text-decoration: none; font-size: 12px; padding: 2px 10px; border-radius: 99px; background: var(--accent-bg); color: var(--accent-text); margin-right: 6px; }
  p.q-text { font-size: 19px; color: var(--text); margin: 0 0 24px; max-width: 70ch; }
  section.block { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin: 0 0 20px; }
  .block-head { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .compare .cap { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .compare .cap a { margin-left: 8px; white-space: nowrap; }
  .shot { position: relative; user-select: none; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; cursor: crosshair; line-height: 0; }
  .shot img { width: 100%; display: block; pointer-events: none; }
  .pin { position: absolute; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; line-height: 1; color: #fff; background: var(--pin); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .pin.mine { background: var(--pin-mine); }
  .box { position: absolute; border: 2.5px solid var(--pin); box-shadow: 0 0 0 1px rgba(255,255,255,.6); background: rgba(24,95,165,.08); border-radius: 3px; }
  .box.mine { border-color: var(--pin-mine); background: rgba(194,65,12,.1); }
  .box .pin { left: 0; top: 0; }
  .box.drawing { border-style: dashed; }
  .hint { font-size: 13px; color: var(--faint); margin-top: 8px; }
  .notes-list { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
  .notes-list li { display: grid; grid-template-columns: minmax(28px, auto) 1fr auto; gap: 10px; align-items: start; font-size: 15px; }
  .notes-list .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: #fff; background: var(--pin); margin-top: 2px; }
  .notes-list .n.mine { background: var(--pin-mine); }
  .notes-list .n.t { width: auto; border-radius: 99px; padding: 0 8px; border: none; cursor: pointer; font-variant-numeric: tabular-nums; }
  .clip video { width: 100%; display: block; border: 1px solid var(--border); border-radius: 6px; background: #000; }
  .clip-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .clip-bar .btn { padding: 5px 12px; font-size: 14px; }
  .clip-bar .spacer { flex: 1; }
  .notes-list input { width: 100%; border: 1px solid var(--border-strong); border-radius: 6px; padding: 6px 10px; background: var(--surface); }
  .notes-list blockquote { margin: 0 0 4px; padding-left: 10px; border-left: 3px solid var(--mine); color: var(--muted); font-size: 14px; }
  .icon-btn { border: none; background: none; color: var(--faint); cursor: pointer; padding: 2px 6px; font-size: 18px; line-height: 1; }
  .icon-btn:hover { color: var(--danger); }
  .doc { font-size: 16px; max-height: 420px; overflow: auto; padding-right: 8px; }
  .doc h3, .doc h4 { font-size: 16px; font-weight: 600; margin: 14px 0 4px; }
  .doc p { margin: 0 0 10px; }
  .doc ul { margin: 0 0 10px; padding-left: 22px; }
  .doc code { font: 14px ui-monospace, Menlo, monospace; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
  .doc mark { background: var(--mark); color: inherit; padding: 1px 2px; border-radius: 3px; }
  .doc mark.mine { background: var(--mine-bg); outline: 1px solid var(--mine); }
  .sel-btn { position: absolute; z-index: 10; border: 1px solid var(--mine); background: var(--mine-bg); color: var(--mine-text); border-radius: 99px; font-size: 13px; padding: 4px 12px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  h3.section { font-size: 15px; font-weight: 500; color: var(--muted); margin: 28px 0 10px; }
  .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .opt { text-align: left; background: var(--surface); border: 1.5px solid var(--border-strong); border-radius: 12px; padding: 16px 18px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
  .opt:hover { border-color: var(--accent); }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-bg); box-shadow: 0 0 0 2px var(--accent) inset; }
  .opt .o-label { font-size: 17px; font-weight: 500; }
  .opt .o-detail { font-size: 14px; color: var(--muted); line-height: 1.5; }
  .opt[aria-pressed="true"] .o-detail { color: var(--accent-text); }
  .rec { align-self: flex-start; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 99px; background: var(--ok-bg); color: var(--ok); }
  textarea { width: 100%; min-height: 120px; border: 1px solid var(--border-strong); border-radius: 10px; padding: 12px 14px; background: var(--surface); font-size: 16px; resize: vertical; }
  textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .err { color: var(--danger); font-size: 14px; margin-top: 8px; }
  .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border); }
  .btn { border: 1px solid var(--border-strong); background: var(--surface); border-radius: var(--radius); padding: 9px 18px; cursor: pointer; font-size: 15px; }
  .btn:hover { background: var(--bg); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 500; }
  .btn.primary:hover { filter: brightness(1.08); }
  .shot-holder { position: relative; }
  .zoom-btn { position: absolute; top: 8px; right: 8px; z-index: 2; border: 1px solid rgba(255,255,255,.7); background: rgba(20,20,20,.75); color: #fff; border-radius: 6px; padding: 3px 10px; font-size: 13px; cursor: zoom-in; }
  .zoom-btn:hover { background: rgba(20,20,20,.9); }
  .lb { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; grid-template-rows: auto minmax(0, 1fr); }
  .lb-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .lb-bar .lb-title { flex: 1; min-width: 0; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lb-bar .btn { padding: 5px 12px; font-size: 14px; }
  .btn[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-text); }
  .lb-main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: 0; }
  .lb-body { overflow: auto; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }
  .lb-body.actual { justify-content: flex-start; }
  .lb-body .shot { flex: none; }
  .lb-side { background: var(--surface); overflow: auto; padding: 16px; border-left: 1px solid var(--border); }
  .lb-side .hint { margin: 0 0 8px; }
  @media (max-width: 860px) { .lb-main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; } .lb-side { max-height: 35vh; border-left: none; border-top: 1px solid var(--border); } }
  .done-card { max-width: 560px; margin: 60px auto; text-align: center; }
  .done-card h2 { font-size: 26px; font-weight: 500; }
  .done-card p { color: var(--muted); font-size: 17px; }
  @media (max-width: 860px) {
    main { padding: 20px; } .compare { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header id="hdr">
  <div class="h-row">
    <h1 id="h-title">Loading review…</h1>
    <nav class="chips" id="chips" aria-label="PRs in this review"></nav>
    <button class="details-btn" id="h-details" type="button" aria-expanded="false">Details</button>
  </div>
  <div class="legend" id="h-legend" hidden></div>
  <div class="stepper">
    <nav class="steps" id="steps" aria-label="Questions"></nav>
    <div class="progress" id="h-progress"></div>
  </div>
</header>
<div class="layout">
  <main id="main"></main>
  <aside id="call" class="call" aria-label="Your call"></aside>
</div>
<script>
const params = new URLSearchParams(location.search);
const packetId = params.get('packet') || 'demo';
const base = `packets/${encodeURIComponent(packetId)}/`;
const storeKey = `review-board:${packetId}`;
let packet, state, current = 0, submitted = false, zoom = null;
const clips = {};

const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
};

function md(src, highlights = [], quotes = []) {
  const inline = t => {
    let s = esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    for (const hl of highlights) s = s.split(esc(hl)).join(`<mark>${esc(hl)}</mark>`);
    for (const q of quotes) s = s.split(esc(q)).join(`<mark class="mine">${esc(q)}</mark>`);
    return s;
  };
  const out = []; let list = null;
  for (const raw of String(src).split('\n')) {
    const line = raw.trimEnd();
    const li = line.match(/^\s*[-*] (?:\[[ x]\] )?(.*)$/);
    if (li) { (list ??= []).push(`<li>${inline(li[1])}</li>`); continue; }
    if (list) { out.push(`<ul>${list.join('')}</ul>`); list = null; }
    const hd = line.match(/^(#{1,4}) (.*)$/);
    if (hd) out.push(`<h4>${inline(hd[2])}</h4>`);
    else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push(`<ul>${list.join('')}</ul>`);
  return out.join('');
}

function blankAnswer() { return { choice: null, other: '', notes: '', markups: [] }; }
function save() { localStorage.setItem(storeKey, JSON.stringify(state)); }
function isAnswered(i) {
  const a = state.answers[i];
  return a.choice && (a.choice !== '__other' || a.other.trim());
}
const totalSteps = () => packet.questions.length + 1;

async function init() {
  try {
    const res = await fetch(base + 'packet.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    packet = await res.json();
  } catch (e) {
    $('#h-title').textContent = `Couldn't load packet "${packetId}"`;
    return;
  }
  document.title = `Review: ${packet.shortTitle || packet.title}`;
  const saved = JSON.parse(localStorage.getItem(storeKey) || 'null');
  state = saved && saved.answers?.length === packet.questions.length
    ? saved : { answers: packet.questions.map(blankAnswer), ownRead: '' };
  groups = buildGroups();
  rulingGroups = [...groups, ...quietGroups()];
  const pr = packet.pr || {};
  // One short title. With a single PR it is the PR; a batch says how many PRs it holds.
  const title = rulingGroups.length > 1 ? `${packet.shortTitle || 'PR review'} · ${rulingGroups.length} PRs` : (packet.shortTitle || packet.title);
  $('#h-title').textContent = title;
  $('#h-title').title = packet.title;
  // The long subtitle (environments, legends) moves behind Details.
  const legend = $('#h-legend'), det = $('#h-details');
  const bits = String(packet.subtitle || '').split(' | ').filter(Boolean);
  legend.replaceChildren(...bits.map(b => h('div', {}, b)));
  det.hidden = !bits.length;
  det.onclick = () => { legend.hidden = !legend.hidden; det.setAttribute('aria-expanded', String(!legend.hidden)); det.textContent = legend.hidden ? 'Details' : 'Hide details'; };
  new ResizeObserver(() => document.documentElement.style.setProperty('--hh', $('#hdr').offsetHeight + 'px')).observe($('#hdr'));
  intro = groups[0] || null;
  render();
}

// Questions grouped by the PR (unit) they come from, in packet order. A question finds its
// unit by its PR ref, or one of the unit's extraPrs (a multi-repo change reviewed as one).
let groups = [];
// Mid-tone hues that read on both the light and dark surfaces.

// Keyboard: number keys pick an option, arrows move. Off while typing or in the lightbox.
let keyPick = null, keyNext = null;

  if (e.target instanceof Element && e.target.matches('input, textarea, select, [contenteditable]')) return;
  if (document.body.classList.contains('uin-on')) return;
  if (/^[1-9]$/.test(e.key) && !intro && current < packet.questions.length && keyPick) { e.preventDefault(); keyPick(Number(e.key)); }
  else if ((e.key === 'ArrowRight' || (intro && e.key === 'Enter')) && (intro || current < packet.questions.length) && keyNext) { e.preventDefault(); keyNext(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); if (intro) { const k = groups.indexOf(intro); if (k > 0) go(groups[k - 1].qs.at(-1), { skipIntro: true }); } else if (current >= packet.questions.length) go(current - 1); else back(current); }
});

function openLink(url) { return /^https?:/i.test(url || '') ? h('a', { href: url, target: '_blank', rel: 'noopener' }, 'Open ↗') : null; }

function renderContext(qi, ctx, ci) {
  const sec = h('section', { class: 'block' });
  sec.append(h('div', { class: 'block-head' }, h('span', {}, ctx.label || ''), openLink(ctx.url)));
  const list = h('ul', { class: 'notes-list' });

    sec.append(renderShot(qi, ci, 0, ctx));
  } else if (ctx.type === 'compare') {
    const grid = h('div', { class: 'compare' });
    ctx.images.forEach((img, k) => grid.append(h('div', {}, h('div', { class: 'cap' }, img.caption || '', openLink(img.url)), renderShot(qi, ci, k, img))));
    sec.append(grid);

    sec.append(renderClip(qi, ci, ctx));
  } else if (ctx.type === 'text') {
    sec.append(renderDoc(qi, ci, ctx, list));

  if (ctx.type === 'compare') return ctx.images.flatMap((im, k) => (im.marks || []).map(m => ({ ...m, img: k })));
  return [];
}

  }

    const input = h('input', { type: 'text', placeholder, value: m.note });
    input.addEventListener('input', () => { m.note = input.value; save(); });
    if (m.focus && inLightbox === !!zoom) { setTimeout(() => input.focus(), 0); delete m.focus; }
    list.append(h('li', {},
      m.type === 'moment' ? seekBtn(qi, ci, m.t, true) : h('span', { class: 'n mine' }, m.type === 'quote' ? '❝' : String.fromCharCode(65 + i)),
      h('span', {}, m.type === 'quote' && h('blockquote', {}, m.quote), input),

function rerenderCurrent() {

}

function zoomImages(ctx) { return ctx.type === 'compare' ? ctx.images : [ctx]; }

  }, im.caption || `Image ${k + 1}`));

    h('div', { class: 'lb-bar' },

document.addEventListener('keydown', e => {
  if (!zoom) return;
  if (e.key === 'Escape') { e.preventDefault(); closeZoom(); return; }
  if (e.target instanceof Element && e.target.matches('input, textarea')) return;
  const n = zoomImages(packet.questions[zoom.qi].context[zoom.ci]).length;
  if (n > 1 && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {

    const size = () => {

  }
  const marks = claudeMarks(packet.questions[qi].context[ci]);
  marks.forEach((m, i) => { if (m.img === k) wrap.append(markEl(m, String(i + 1), false)); });
  a.markups.filter(m => m.ctx === ci && m.img === k && m.type !== 'quote').forEach(m => {
    const mine = a.markups.filter(x => x.ctx === ci);
    wrap.append(markEl(m, String.fromCharCode(65 + mine.indexOf(m)), true));
  });
  let start = null, ghost = null;
  const pct = e => { const r = wrap.getBoundingClientRect(); return { x: Math.min(100, Math.max(0, (e.clientX - r.left) / r.width * 100)), y: Math.min(100, Math.max(0, (e.clientY - r.top) / r.height * 100)) }; };
  wrap.addEventListener('pointerdown', e => {
    if (e.target.closest('.pin')) return;
    start = pct(e); wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove', e => {
    if (!start) return;
    const p = pct(e);
    if (!ghost && Math.hypot(p.x - start.x, p.y - start.y) > 1.5) { ghost = h('div', { class: 'box mine drawing' }); wrap.append(ghost); }
    if (ghost) Object.assign(ghost.style, { left: Math.min(p.x, start.x) + '%', top: Math.min(p.y, start.y) + '%', width: Math.abs(p.x - start.x) + '%', height: Math.abs(p.y - start.y) + '%' });
  });
  wrap.addEventListener('pointerup', e => {
    if (!start) return;
    const p = pct(e);
    const r2 = n => Math.round(n * 10) / 10;
    const m = ghost
      ? { type: 'box', ctx: ci, img: k, x: r2(Math.min(p.x, start.x)), y: r2(Math.min(p.y, start.y)), w: r2(Math.abs(p.x - start.x)), h: r2(Math.abs(p.y - start.y)), note: '' }
      : { type: 'pin', ctx: ci, img: k, x: r2(p.x), y: r2(p.y), note: '' };
    start = null; ghost = null;
    a.markups.push({ ...m, focus: true }); save(); rerenderCurrent();
  });
  if (opts.lightbox) return wrap;
  const enlarge = h('button', { class: 'zoom-btn', type: 'button', onclick: () => openZoom(qi, ci, k), 'aria-label': `Enlarge ${img.caption || 'screenshot'}` }, '⤢ Enlarge');
  return h('div', {},
    h('div', { class: 'shot-holder' }, wrap, enlarge),
    h('div', { class: 'hint' }, 'Click to drop a pin, or drag to draw a box. Use Enlarge for a closer look.'));
}

function markEl(m, label, mine) {
  const pin = h('span', { class: 'pin' + (mine ? ' mine' : '') }, label);
  if (m.w != null) {
    const box = h('div', { class: 'box' + (mine ? ' mine' : ''), style: `left:${m.x}%;top:${m.y}%;width:${m.w}%;height:${m.h}%` }, pin);
    return box;
  }
  pin.style.left = m.x + '%'; pin.style.top = m.y + '%';
  return pin;
}

const clock = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;

function seekBtn(qi, ci, t, mine) {
  return h('button', { class: 'n t' + (mine ? ' mine' : ''), type: 'button', title: 'Jump here', 'aria-label': `Jump to ${clock(t)}`, onclick: () => {
    const v = clips[`${qi}:${ci}`]?.el;
    if (v) { v.pause(); v.currentTime = t; v.focus(); }
  } }, clock(t));
}

function renderClip(qi, ci, ctx) {
  const a = state.answers[qi], key = `${qi}:${ci}`;
  const pos = clips[key] ||= { t: 0, rate: 1 };
  const v = h('video', { src: base + ctx.src, controls: true, preload: 'metadata', playsinline: true, muted: true, poster: ctx.poster ? base + ctx.poster : null, 'aria-label': ctx.caption || ctx.label || 'Clip' });
  pos.el = v;
  v.addEventListener('loadedmetadata', () => { if (pos.t) v.currentTime = pos.t; v.playbackRate = pos.rate; });
  v.addEventListener('timeupdate', () => { pos.t = v.currentTime; stamp.textContent = `+ Note at ${clock(v.currentTime)}`; });
  const speeds = [1, 0.5, 0.25].map(r => h('button', { class: 'btn', type: 'button', 'aria-pressed': pos.rate === r ? 'true' : 'false', onclick: e => {
    pos.rate = r; v.playbackRate = r;
    e.currentTarget.parentNode.querySelectorAll('[data-rate]').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.rate) === r)));
  }, 'data-rate': r }, r === 1 ? 'Normal speed' : `${r}×`));
  const stamp = h('button', { class: 'btn', type: 'button', onclick: () => {
    v.pause();
    a.markups.push({ type: 'moment', ctx: ci, t: Math.round(v.currentTime * 10) / 10, note: '', focus: true }); save(); rerenderCurrent();
  } }, `+ Note at ${clock(pos.t)}`);
  return h('div', { class: 'clip' },
    ctx.caption && h('div', { class: 'cap', style: 'font-size:13px;font-weight:500;margin-bottom:6px' }, ctx.caption), v,
    h('div', { class: 'clip-bar' }, ...speeds, h('span', { class: 'spacer' }), stamp),
    h('div', { class: 'hint' }, 'Slow it down to catch a flicker. Pause where something looks wrong and add a note at that moment.'));
}

function renderDoc(qi, ci, ctx, list) {
  const a = state.answers[qi];
  const quotes = a.markups.filter(m => m.ctx === ci && m.type === 'quote').map(m => m.quote);
  const doc = h('div', { class: 'doc', html: md(ctx.body, ctx.highlight || [], quotes) });
  const holder = h('div', { style: 'position:relative' }, doc, h('div', { class: 'hint' }, 'Highlighted lines are what this question is about. Select any text to comment on it.'));
  let btn = null;
  const clear = () => { btn?.remove(); btn = null; };
  doc.addEventListener('mouseup', () => {
    setTimeout(() => {
      clear();
      const sel = window.getSelection(); const text = sel.toString().trim();
      if (!text || !doc.contains(sel.anchorNode)) return;
      const r = sel.getRangeAt(0).getBoundingClientRect(), hr = holder.getBoundingClientRect();
      btn = h('button', { class: 'sel-btn', style: `left:${r.left - hr.left}px;top:${r.bottom - hr.top + 6}px`, onmousedown: e => e.preventDefault(), onclick: () => {
        a.markups.push({ type: 'quote', ctx: ci, quote: text, note: '', focus: true }); save(); clear(); rerenderCurrent();
      } }, '+ Comment on selection');
      holder.append(btn);
    }, 0);
  });
  doc.addEventListener('mousedown', clear);
  return holder;
}

function renderOwnRead(main, call) {
  main.append(
    h('div', { class: 'q-meta' }, h('span', { class: 'tag' }, 'Your read')),
    h('h2', { class: 'q-title' }, 'Anything else you noticed?'),
    h('p', { class: 'q-text' }, packet.ownReadPrompt || 'Anything from your own testing, a meeting, or a gut reaction that the questions did not cover. Leave it blank if nothing comes to mind.'));
  const ta = h('textarea', { style: 'min-height:220px', placeholder: 'I tried it on my phone and…' });
  ta.value = state.ownRead;
  ta.addEventListener('input', () => { state.ownRead = ta.value; save(); renderHeader(); });
  main.append(ta);
  // A recap of every ruling, grouped by PR, so a misclick is caught before sending.
  main.append(h('h3', { class: 'evidence-h', style: 'margin-top:32px' }, 'Your rulings'),
    h('p', { class: 'hint', style: 'margin:-4px 0 12px' }, 'Sending finishes the review: each PR posts with the ruling shown, and nothing is asked again in chat. Rulings come from your answers; click another to change one.'));
  for (const g of rulingGroups) {
    const v = verdictFor(g);
    const seg = h('div', { class: 'verdict', role: 'group', 'aria-label': `Ruling for ${shortRef(g.ref)}` },
      ...Object.entries(VERDICTS).map(([k, label]) => h('button', {
        type: 'button', class: 'btn', 'aria-pressed': v.verdict === k ? 'true' : 'false',
        onclick: () => { (state.verdicts ||= {})[g.key] = k === v.inferred ? undefined : k; save(); rerenderCurrent(); }
      }, label)));
    const why = g.quiet && !v.verdict ? 'Nothing was held for you on this PR. Pick a ruling from your own testing.'
      : g.quiet ? 'Your ruling. Nothing was held for you on this PR.'
      : v.open ? `${v.open} question${v.open > 1 ? 's' : ''} still open.`
      : v.overridden ? `You changed this. Your answers pointed to ${VERDICTS[v.inferred]}.`
      : v.verdict === 'approve' ? 'From your answers: nothing needs to change.'
      : `From your answers on question ${v.because.join(', ')}.`;
    const onSend = v.verdict && !v.open ? h('div', { class: 'hint', style: 'margin:0 0 8px' }, h('strong', {}, 'On send: '), ON_SEND[v.verdict]) : null;
    main.append(h('section', { class: 'block', style: `--c:${g.color};border-left:4px solid ${g.color}` },
      h('div', { class: 'block-head' }, h('span', {}, h('strong', {}, shortRef(g.ref)), g.label ? ` ${g.label}` : '')),
      h('div', { class: 'v-row' }, seg, h('span', { class: 'hint', style: 'margin:0' }, why)), onSend,
      g.quiet && unitCard(g.unit, false),
      !g.quiet && h('ul', { class: 'notes-list' }, ...g.qs.map(i => {
        const q = packet.questions[i], a = state.answers[i];
        const label = a.choice === '__other' ? a.other.trim() : (q.options || []).find(o => o.value === a.choice)?.label;
        return h('li', {}, h('button', { class: 'n t', type: 'button', onclick: () => go(i), title: 'Change' }, String(i + 1)),
          h('span', {}, q.ask || q.title, h('br'), label ? h('strong', {}, label) : h('span', { class: 'err' }, 'Not answered')), h('span'));
      }))));
  }
  call.append(h('p', { class: 'kicker' }, 'Send'), h('p', { class: 'ask' }, `${answeredCount()} of ${packet.questions.length} answered`));
  const err = h('div', { class: 'err', hidden: true });
  const send = h('button', { class: 'btn primary', onclick: async () => {
    const missing = packet.questions.findIndex((_, i) => !isAnswered(i));
    if (missing >= 0) { err.textContent = `Question ${missing + 1} still needs an answer.`; err.hidden = false; return; }
    const unruled = rulingGroups.find(g => !verdictFor(g).verdict);
    if (unruled) { err.textContent = `${shortRef(unruled.ref)} still needs a ruling.`; err.hidden = false; return; }
    send.disabled = true; send.textContent = 'Sending…';
    try {
      const res = await fetch(`api/answers?packet=${encodeURIComponent(packetId)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(buildAnswers()) });
      if (!res.ok) throw new Error(res.status);
      submitted = true; render();
    } catch (e) {
      err.textContent = "Couldn't reach the review server. Your answers are saved here, so try again in a moment.";
      err.hidden = false; send.disabled = false; send.textContent = 'Send and post reviews';
    }
  } }, 'Send and post reviews');
  call.append(err, h('div', { class: 'pager' }, h('button', { class: 'btn', onclick: () => go(packet.questions.length - 1) }, '← Back'), send));
}

function buildAnswers() {
  return {
    packet: packetId, title: packet.title, submittedAt: new Date().toISOString(),
    answers: packet.questions.map((q, i) => {
      const a = state.answers[i];
      const opt = (q.options || []).find(o => o.value === a.choice);
      return {
        id: q.id, pr: q.pr?.ref || packet.pr?.ref || null, title: q.title, dimension: q.dimension || null,
        choice: a.choice === '__other' ? 'other' : a.choice,
        choiceLabel: a.choice === '__other' ? a.other.trim() : opt?.label,
        notes: a.notes.trim() || null,
        markups: a.markups.map(m => {
          const ctx = q.context[m.ctx];
          const where = ctx.type === 'compare' ? ctx.images[m.img] : ctx;
          return { on: where.caption || ctx.label, file: where.src || null, ...m, ctx: undefined, img: undefined };
        })
      };
    }),
    // The per-PR ruling, so the review posts without a second approve/request-changes ask in chat.
    verdicts: rulingGroups.map(g => { const v = verdictFor(g); return { pr: g.ref, verdict: v.verdict, inferred: !v.overridden, because: v.because }; }),
    ownRead: state.ownRead.trim() || null
  };
}

// Approve / Request changes / Comment per PR, inferred from the answers. An option can say
// what it means with `verdict`; without one, its label is read. Any "change it" answer wins,
// then any "hold / ask someone" answer, else approve. The reviewer can override on the page.
const VERDICTS = { approve: 'Approve', changes: 'Request changes', comment: 'Comment, no ruling yet' };
// What Send does for each ruling. Finishing the board finishes the review: nothing is asked again in chat.
const ON_SEND = { approve: 'Posts an approval and labels it ready to merge.', changes: 'Posts a changes request to the developer and swaps needs review for needs work.', comment: 'Posts your open decision as a comment. Labels stay as they are.' };
function optionVerdict(q, a) {
  if (a.choice === '__other') return 'comment';
  const o = (q.options || []).find(x => x.value === a.choice);
  if (!o) return null;
  if (o.verdict) return o.verdict;
  const t = `${o.value} ${o.label}`;
  if (/fix it|in this pr|change it here|must |darker|adjust|edit (some|the)|block on|add them|should be searched|ask for a|only fix|should count|hold until/i.test(t)) return 'changes';
  if (/defer|decide later|keep holding|hold for|ask april|leave it for|talk it through|check with|weighs in|test it live|we run it/i.test(t)) return 'comment';
  return 'approve';
}
function verdictFor(g) {
  const rank = { changes: 3, comment: 2, approve: 1 };
  let best = null, because = [];
  for (const i of g.qs) {
    const v = optionVerdict(packet.questions[i], state.answers[i]);
    if (!v) continue;
    if (!best || rank[v] > rank[best]) { best = v; because = []; }
    if (v === best && v !== 'approve') because.push(i);
  }
  const open = g.qs.filter(i => !isAnswered(i)).length;
  const over = state.verdicts?.[g.key];
  return { verdict: over || best, inferred: best, overridden: !!over && over !== best, because: because.map(i => i + 1), open };
}

function renderDone(main) {
  main.append(h('div', { class: 'done-card' },
    h('h2', {}, 'Sent to Claude'),
    h('p', {}, 'Claude posts each review with the ruling you saw, plus any follow-up tickets you asked for. There is nothing more to answer.'),
    h('button', { class: 'btn', onclick: () => go(0) }, 'Edit and resend')));
  $('#h-progress').textContent = 'Submitted';
}

init();
</script>
